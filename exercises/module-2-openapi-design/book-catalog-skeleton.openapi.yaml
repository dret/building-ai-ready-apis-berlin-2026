# -----------------------------------------------------------------------
# Components
# -----------------------------------------------------------------------
components:

  parameters:
    bookIdParam:
      name: bookId
      in: path
      required: true
      description: "TODO: Unique identifier of the book — UUID format"
      schema:
        type: string
        format: uuid
        example: 01938a7c-1234-7abc-8def-0123456789ab

    authorIdParam:
      name: authorId
      in: path
      required: true
      description: "TODO: Unique identifier of the author — UUID format"
      schema:
        type: string
        format: uuid
        example: 01938a7c-5678-7abc-8def-0123456789cd

    offsetParam:
      name: offset
      in: query
      required: false
      description: "TODO: Explain offset pagination — what does offset 0 mean, what does offset 50 return if limit is 50?"
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

    limitParam:
      name: limit
      in: query
      required: false
      description: "TODO: Explain what limit does, what the default is, and what the maximum is"
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
        example: 50

  schemas:

    # ---- Enums ----

    Genre:
      type: string
      description: "TODO: Describe what genres are available and that unknown values must be tolerated by clients"
      enum:
        - fiction
        - non-fiction
        - science
        - history
        - biography
        - technology
        - children
      example: fiction

    RetailerType:
      type: string
      description: "TODO: Describe what each retailer type means for a consumer"
      enum:
        - online
        - physical
      example: online

    Availability:
      type: string
      description: "TODO: Explain what each status means for purchasing decisions — when is pre-order different from out-of-stock?"
      enum:
        - in-stock
        - out-of-stock
        - pre-order
      example: in-stock

    ReadingStatus:
      type: string
      description: "TODO: Describe the lifecycle — can a book move from finished back to reading?"
      enum:
        - want-to-read
        - reading
        - finished
      example: want-to-read

    # ---- Value objects ----

    Money:
      type: object
      description: "TODO: Explain why decimal string is used instead of number — hint: floating point precision"
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: "TODO: Describe the format — how many decimal places? Is it always positive?"
          example: "19.99"
        currency:
          type: string
          description: ISO 4217 currency code
          minLength: 3
          maxLength: 3
          example: USD

    # ---- Core resources ----

    Book:
      type: object
      description: "TODO: Describe the Book resource — what it represents and its key relationships"
      required:
        - id
        - title
        - description
        - genre
        - publishedAt
        - pageCount
        - price
        - authorId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the book.
          readOnly: true
          example: 01938a7c-1234-7abc-8def-0123456789ab
        title:
          type: string
          description: "TODO: Describe the title field — any length constraints?"
          example: "Dune"
        description:
          type: string
          description: "TODO: Describe what this contains — plot summary, back cover copy, etc."
          example: "A science fiction novel set in the distant future amidst a feudal interstellar society."
        genre:
          $ref: '#/components/schemas/Genre'
        publishedAt:
          type: string
          format: date
          description: "TODO: Describe the publication date — is this the original publication or the edition date?"
          readOnly: true
          example: "1965-08-01"
        pageCount:
          type: integer
          description: "TODO: Describe the pageCount — what edition does this refer to?"
          minimum: 1
          example: 412
        averageRating:
          type: number
          description: "TODO: Who calculates this? Can it be null? What scale is it on?"
          minimum: 1
          maximum: 5
          readOnly: true
          example: 4.7
        price:
          $ref: '#/components/schemas/Money'
        coverImageUrl:
          type: ["string", "null"]
          format: uri
          description: "TODO: When is this null? What image dimensions/formats are served?"
          example: "https://images.example.com/books/01938a7c-1234.jpg"
        authorId:
          type: string
          format: uuid
          description: "TODO: Describe this reference — how does a consumer resolve it to an Author?"
          example: 01938a7c-5678-7abc-8def-0123456789cd
        createdAt:
          type: string
          format: date-time
          description: "TODO: When the book record was created in the catalog — not the publication date"
          readOnly: true
          example: "2024-01-15T09:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "TODO: When the book record was last modified"
          readOnly: true
          example: "2024-06-20T14:30:00Z"

    Author:
      type: object
      description: "TODO: Describe the Author resource and its relationship to Books"
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the author.
          readOnly: true
          example: 01938a7c-5678-7abc-8def-0123456789cd
        name:
          type: string
          description: "TODO: Full name? Pen name? Any formatting rules?"
          example: "Frank Herbert"
        biography:
          type: ["string", "null"]
          description: "TODO: When is this null? What does it contain?"
          example: "Frank Herbert was an American science fiction author best known for the Dune series."
        photoUrl:
          type: ["string", "null"]
          format: uri
          description: "TODO: When is this null? What image dimensions are served?"
          example: "https://images.example.com/authors/frank-herbert.jpg"
        websiteUrl:
          type: ["string", "null"]
          format: uri
          description: "TODO: When is this null — is it the author's official website?"
          example: "https://www.dunenovels.com"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2024-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2024-06-01T00:00:00Z"

    Retailer:
      type: object
      description: "TODO: Describe the Retailer resource — what does it represent in the context of a book purchase?"
      required:
        - id
        - name
        - type
        - availability
        - price
      properties:
        id:
          type: string
          format: uuid
          description: "TODO: Unique identifier of the retailer listing for this book"
          readOnly: true
          example: 01938b00-aaaa-7abc-8def-000000000001
        name:
          type: string
          description: "TODO: The display name of the retailer"
          example: "Amazon"
        type:
          $ref: '#/components/schemas/RetailerType'
        availability:
          $ref: '#/components/schemas/Availability'
        price:
          $ref: '#/components/schemas/Money'
        url:
          type: ["string", "null"]
          format: uri
          description: "TODO: When is this present vs null — is it always present for online retailers?"
          example: "https://www.amazon.com/dp/0441013597"
        address:
          type: ["string", "null"]
          description: "TODO: When is this present vs null — is it always present for physical retailers?"
          example: null

    ReadingListEntry:
      type: object
      description: "TODO: Describe the ReadingListEntry — what does it track, who does it belong to?"
      required:
        - bookId
        - status
        - addedAt
        - updatedAt
      properties:
        bookId:
          type: string
          format: uuid
          description: "TODO: The book this entry refers to — how does a consumer resolve it to full Book details?"
          example: 01938a7c-1234-7abc-8def-0123456789ab
        status:
          $ref: '#/components/schemas/ReadingStatus'
        addedAt:
          type: string
          format: date-time
          description: "TODO: When the book was added to the reading list"
          readOnly: true
          example: "2025-03-01T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2025-03-15T11:00:00Z"

    ReadingListEntryRequest:
      type: object
      description: "TODO: Distinguish from ReadingListEntry — this is the write shape (request body). ReadOnly fields are excluded."
      required:
        - bookId
        - status
      properties:
        bookId:
          type: string
          format: uuid
          description: "TODO: The UUID of the book to add or update"
          example: 01938a7c-1234-7abc-8def-0123456789ab
        status:
          $ref: '#/components/schemas/ReadingStatus'

    # ---- Collection wrappers ----

    PaginationMeta:
      type: object
      description: Pagination metadata returned with every collection response.
      required:
        - totalCount
        - limit
        - offset
      properties:
        totalCount:
          type: integer
          description: "TODO: Total number of items matching the current filters, across all pages — not just this page"
          example: 312
        limit:
          type: integer
          description: "TODO: The number of items per page as applied — may be less than requested if clamped"
          example: 50
        offset:
          type: integer
          description: "TODO: The zero-based index of the first item in this page"
          example: 0

    BookCollection:
      type: object
      description: "TODO: Describe the BookCollection — it wraps a page of Book objects with pagination metadata"
      required:
        - data
        - meta
      properties:
        data:
          type: array
          description: "TODO: The array of Book objects on this page — may be empty"
          items:
            $ref: '#/components/schemas/Book'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AuthorCollection:
      type: object
      description: "TODO: Describe the AuthorCollection"
      required:
        - data
        - meta
      properties:
        data:
          type: array
          description: "TODO: The array of Author objects on this page"
          items:
            $ref: '#/components/schemas/Author'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    RetailerCollection:
      type: object
      description: "TODO: Describe the RetailerCollection"
      required:
        - data
        - meta
      properties:
        data:
          type: array
          description: "TODO: The array of Retailer objects on this page"
          items:
            $ref: '#/components/schemas/Retailer'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ReadingListCollection:
      type: object
      description: "TODO: Describe the ReadingListCollection"
      required:
        - data
        - meta
      properties:
        data:
          type: array
          description: "TODO: The array of ReadingListEntry objects on this page"
          items:
            $ref: '#/components/schemas/ReadingListEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # -----------------------------------------------------------------------
    # Error Responses — RFC 9457 Problem Details
    # -----------------------------------------------------------------------
    #
    # These response definitions follow RFC 9457 Problem Details for HTTP APIs.
    # The ProblemDetails schema below is an inline copy for workshop self-containedness.
    #
    # In production, you can reference the canonical jentic/api-problem-details
    # components directly as external $refs instead of defining them inline:
    #
    #   responses:
    #     '400':
    #       $ref: 'https://raw.githubusercontent.com/jentic/api-problem-details/refs/heads/main/responses/400-bad-request.yaml'
    #     '401':
    #       $ref: 'https://raw.githubusercontent.com/jentic/api-problem-details/refs/heads/main/responses/401-unauthorized.yaml'
    #     '404':
    #       $ref: 'https://raw.githubusercontent.com/jentic/api-problem-details/refs/heads/main/responses/404-not-found.yaml'
    #     '409':
    #       $ref: 'https://raw.githubusercontent.com/jentic/api-problem-details/refs/heads/main/responses/409-conflict.yaml'
    #     '500':
    #       $ref: 'https://raw.githubusercontent.com/jentic/api-problem-details/refs/heads/main/responses/500-server-error.yaml'
    #
    # See: https://github.com/jentic/api-problem-details
    #
    ProblemDetails:
      type: object
      description: >-
        RFC 9457 Problem Details error response. Used for all 4xx and 5xx responses
        with Content-Type: application/problem+json.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI that identifies the error type. Use "about:blank" when no specific type URI exists.
          example: "about:blank"
        title:
          type: string
          description: Short, stable, human-readable summary of the error class. Does not change between occurrences.
          example: "Bad Request"
        status:
          type: integer
          description: HTTP status code. Mirrors the response status.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence. Should help the caller recover.
          example: "The request body has 1 invalid field."
        instance:
          type: string
          description: A URI reference that identifies this specific occurrence of the problem.
          example: "/books"
        errors:
          type: array
          description: Validation error details. Present on 400 responses when field-level errors exist.
          items:
            type: object
            required:
              - name
              - reason
            properties:
              name:
                type: string
                description: The name of the field or parameter that failed validation.
                example: "genre"
              reason:
                type: string
                description: Why the field failed validation.
                example: "must be one of: fiction, non-fiction, science, history, biography, technology, children"

  responses:
    BadRequest:
      description: The request was malformed or contained invalid parameters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Bad Request"
            status: 400
