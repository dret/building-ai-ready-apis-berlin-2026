  # -----------------------------------------------------------------------

  /books:
    get:
      operationId: listBooks
      summary: Search and browse books
      description: >-
        TODO: Write an agent-ready description. Answer:
        1. What does this operation do?
        2. What filters are available and what do they do?
        3. What does it return (name the response shape)?
        4. What definitive language should you use for required vs optional filters?
      tags:
        - books
      parameters:
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - name: genre
          in: query
          description: "TODO: Add description. What values are accepted? What happens if an unrecognised value is passed?"
          required: false
          schema:
            $ref: '#/components/schemas/Genre'
        - name: authorId
          in: query
          description: "TODO: Describe this filter — what type, what format, what does it do?"
          required: false
          schema:
            type: string
            format: uuid
        - name: minRating
          in: query
          description: "TODO: Describe the range and what this filter does"
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 5
        - name: maxPrice
          in: query
          description: "TODO: Describe what currency this uses and what happens at the boundary"
          required: false
          schema:
            type: number
            minimum: 0
        - name: q
          in: query
          description: "TODO: Describe the text search behaviour — what fields are searched, is it case-sensitive, partial matching?"
          required: false
          schema:
            type: string
      responses:
        '200':
          description: "TODO: Describe the success response — what does it contain?"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCollection'
              examples:
                default:
                  summary: "TODO: Replace with a realistic example showing 2-3 books"
                  value: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}:
    get:
      operationId: getBook
      summary: Get full book details
      description: >-
        TODO: Write an agent-ready description. When should an agent call this vs listBooks?
        What does it return? What happens if the book does not exist?
      tags:
