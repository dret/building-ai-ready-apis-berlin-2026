      parameters:
        - $ref: '#/components/parameters/bookIdParam'
      responses:
        '200':
          description: "TODO: Describe the success response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              examples:
                default:
                  summary: "TODO: Replace with a realistic book example"
